name: Merge Generated PRs On Green

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - closed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-open-pr-queue
  cancel-in-progress: false

jobs:
  merge-when-green:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Evaluate auto-merge conditions
        id: evaluate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });

            const eligible = openPulls
              .filter((pr) => !pr.draft)
              .sort((a, b) => {
                const createdDiff = new Date(a.created_at).getTime() - new Date(b.created_at).getTime();
                return createdDiff !== 0 ? createdDiff : a.number - b.number;
              });

            if (eligible.length === 0) {
              core.info('No eligible open non-draft PRs found.');
              core.setOutput('should_merge', 'false');
              return;
            }

            const queueNumbers = eligible.map((pr) => pr.number);
            const nextPr = eligible[0];

            core.info(`Ordered merge queue: ${queueNumbers.join(', ')}`);
            core.info(`Next PR to arm for auto-merge: #${nextPr.number}`);
            core.setOutput('should_merge', 'true');
            core.setOutput('target_pr_number', String(nextPr.number));
            core.setOutput('queued_pr_numbers', queueNumbers.slice(1).join(' '));

      - name: Disable auto-merge on queued PRs
        if: ${{ steps.evaluate.outputs.should_merge == 'true' && steps.evaluate.outputs.queued_pr_numbers != '' }}
        run: |
          for pr in ${{ steps.evaluate.outputs.queued_pr_numbers }}; do
            if [[ "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
              echo "Disabling auto-merge for queued PR #$pr to preserve ordering."
              gh pr merge "$pr" --disable-auto
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Enable GitHub auto-merge for next queued PR
        if: ${{ steps.evaluate.outputs.should_merge == 'true' }}
        run: |
          target_pr="${{ steps.evaluate.outputs.target_pr_number }}"
          if [[ "$(gh pr view "$target_pr" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            echo "Auto-merge already enabled for PR #$target_pr."
          else
            gh pr merge "$target_pr" --auto --squash
          fi
        env:
          GH_TOKEN: ${{ github.token }}
